[project]
name = "sigaa-mcp"
version = "0.1.0"
description = "Servidor MCP para o SIGAA da UNEMAT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "selectolax>=1.0.2",
]

[project.scripts]
sigaa-mcp = "sigaa_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
